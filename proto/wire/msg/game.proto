syntax = "proto3";
package wire.msg;
option go_package = "github.com/verath/archipelago/lib/wire/msg";

/* Model */

message Coordinate {
    int32 x = 1;
    int32 y = 2;
}

message FloatCoordinate {
    float x = 1;
    float y = 2;
}

// PlayerState represents the current exclusive state of a Player.
enum PlayerState {
    // ALIVE is when still alive in the game.
	ALIVE = 0;
	// PENDING_REVIVAL is when dead, but may be revived.
	PENDING_REVIVAL = 1;
	// DEAD is when dead and will remain dead.
	DEAD = 2;
	// LEFT_GAME is when the Player has left the game.
	LEFT_GAME = 3;
}

message Player {
    string id = 1;
    PlayerState state = 2;
    // Only set for the receiving player: the highest ActionGameLaunch.seq
    // the server has processed, whether the launch succeeded or not.
    uint32 last_launch_seq = 3;
}

message Army {
    string owner_id = 1;
    int32 strength = 2;
}

message Airplane {
    string id = 1;
    Army army = 2;
    FloatCoordinate position = 3;
    float direction = 4;
    // Speed of the Airplane [tiles/ms]. The default is 1/3000 tiles/ms, i.e.
    // 1 tile per 3 s.
    float speed = 5;
    // Only set for the receiving player's own airplanes: id of the island
    // the airplane is flying to.
    string destination_id = 6;
    // Only set for the receiving player's own airplanes: the
    // ActionGameLaunch.seq of the launch that created the airplane. Not set
    // for airplanes not created by a launch (e.g. when revived).
    uint32 launch_seq = 7;
}

message Island {
    string id = 1;
    Army army = 2;
    Coordinate position = 3;
    float size = 4;
}

message Game {
    string id = 1;
    Coordinate size = 2;
    Player player_neutral = 3;
    repeated Player players = 4;
    repeated Island islands = 5;
    repeated Airplane airplanes = 6;
}

/* Event */

// The protocol (version 5, the "v" query parameter of the websocket URL):
// The server sends EventGameStart, then an EventGameSnapshot with the full
// game state, then an EventGameDelta with the changes since the previous
// snapshot/delta every tick, then EventGameOver. The server may send another
// EventGameSnapshot instead of a delta at any time. The client sends
// actions, setting ActionGameLaunch.seq. A client whose connection broke
// during the game can resume it on a new connection, see
// EventGameStart.resume_token.
message EventEnvelope {
    // 3 was EventGameTick, the full game state every tick (version 4).
    reserved 3;
    reserved "event_game_tick";
    oneof event {
        EventGameStart event_game_start = 1;
        EventGameOver event_game_over = 2;
        EventGameSnapshot event_game_snapshot = 4;
        EventGameDelta event_game_delta = 5;
    }
}

message EventGameStart {
    string player_id = 1;
    // Aprox. time between ticks [ms].
    uint32 tick_interval = 2;
    // Token for resuming the game after the connection broke. To resume,
    // connect to the websocket URL with the query parameters
    // "v=5&resume=<token>" within resume_timeout of the server noticing the
    // old connection broke (a server notices within ~10 s, or right away when
    // the client resumes). The server then sends EventGameStart again (same
    // player_id and resume_token), an EventGameSnapshot with the current
    // state (seq starting over at 1), then deltas as usual. If the game ended
    // meanwhile, the snapshot is followed by EventGameOver. A connection the
    // server still considers open is closed by the resume. If the game can't
    // be resumed (unknown or expired token, or the game is over and its
    // EventGameOver was delivered), the server responds with HTTP 410 Gone
    // instead of upgrading to a websocket. ActionGameLaunch.seq continues
    // across reconnects.
    string resume_token = 3;
    // How long after the connection broke the client may resume [ms], see
    // resume_token.
    uint32 resume_timeout = 4;
}

message EventGameOver {
    string winner_id = 1;
}

// EventGameSnapshot is the full game state, as seen by the receiving player.
// It replaces any state the client has.
message EventGameSnapshot {
    // Sequence number of this message. The next EventGameDelta has seq + 1.
    uint32 seq = 1;
    // Game time [ms] of the state, i.e. time since the game started, always
    // whole ms on the server. Airplane positions are at this time. Airplanes
    // fly at a constant speed and direction until they arrive, so at game
    // time t an airplane is at
    //   position + speed * (t - t0) * (cos(direction), sin(direction))
    // where position is as sent and t0 the game_time of the snapshot or
    // delta that sent it.
    uint32 game_time = 2;
    Game game = 3;
}

// EventGameDelta is the changes to the game state since the previous
// EventGameSnapshot or EventGameDelta, as seen by the receiving player. Sent
// every tick, also when nothing changed. Anything not listed is unchanged.
// Islands are never added or removed. An airplane's flight (position at
// game time, direction, speed) never changes after it was added, but its
// army does, and destination_id and launch_seq are cleared when its owner
// leaves and it becomes neutral (they are not sent again).
//
// A client applies the lists in this order: players, islands,
// airplanes_removed, airplanes_added, airplanes_updated. (An airplane can be
// both removed and added, to replace it.)
message EventGameDelta {
    // Sequence number of this message: the previous message's seq + 1. A
    // client that sees any other seq has missed a message.
    uint32 seq = 1;
    // Game time [ms] of the state, see EventGameSnapshot.game_time.
    uint32 game_time = 2;
    // Players whose state or last_launch_seq changed, in full.
    repeated Player players = 3;
    // Islands whose army (owner or strength) changed.
    repeated IslandUpdate islands = 4;
    // New airplanes, in full. Their position is at game_time.
    repeated Airplane airplanes_added = 5;
    // Airplanes whose army changed, e.g. strength hidden (-1) when flying
    // into fog of war.
    repeated AirplaneUpdate airplanes_updated = 6;
    // Ids of airplanes that arrived (or otherwise disappeared). Applied
    // before airplanes_added.
    repeated string airplanes_removed = 7;
}

message IslandUpdate {
    string id = 1;
    // Always set, both owner and strength.
    Army army = 2;
}

message AirplaneUpdate {
    string id = 1;
    // Always set, both owner and strength.
    Army army = 2;
}

/* Action */

message ActionEnvelope {
    oneof action {
        ActionGameLeave action_game_leave = 1;
        ActionGameLaunch action_game_launch = 2;
    }
}

message ActionGameLeave {
}

message ActionGameLaunch {
    string from_id = 1;
    string to_id = 2;
    // Sequence number chosen by the client, starting at 1 and increasing
    // with each launch during the game, also across reconnects (a client
    // that lost count continues after the Player.last_launch_seq it gets).
    // Echoed in Player.last_launch_seq and Airplane.launch_seq.
    uint32 seq = 3;
}
